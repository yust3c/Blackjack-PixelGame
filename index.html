<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scenarios.css">
  <link rel="stylesheet" href="css/cosmetics.css">
</head>
<body>
  <!-- Main menu -->
  <section id="menu" class="menu" aria-label="Main menu"></section>
  <section id="lore" class="menu lore" aria-label="Lore" hidden></section>

  <!-- Table -->
  <div id="game" hidden>
    <header class="topbar">
      <div class="brand">
        <h1>Blackjack</h1>
        <span id="mode-label" class="mode-label"></span>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-label">Bankroll</span><strong id="bankroll">0</strong></div>
        <div class="stat" id="goal-stat" hidden><span class="stat-label" id="goal-label">Goal</span><strong id="goal"></strong></div>
        <div class="stat"><span class="stat-label">Shoe</span><span id="shoe"></span></div>
        <button id="to-menu" class="btn btn-ghost" type="button">Menu</button>
      </div>
    </header>

    <main>
      <div class="progress" id="progress" hidden><div class="progress-fill" id="progress-fill"></div></div>
      <section class="table" aria-label="Blackjack table">
        <div class="dealer">
          <div class="dealer-label">Dealer <span id="dealer-total" class="total"></span></div>
          <div class="cards" id="dealer-cards"></div>
        </div>
        <div class="table-print">
          <div class="print-main">BLACKJACK PAYS 3 TO 2</div>
          <div class="print-sub" id="table-limits"></div>
        </div>
        <div class="message" id="message" aria-live="polite"></div>
        <div class="seats" id="seats"></div>
      </section>

      <section class="controls" id="controls" aria-label="Controls"></section>
      <section class="coach" id="coach" hidden aria-label="Practice coach"></section>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/save.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/strategy.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/dealers.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/cosmetics.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/lore.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
